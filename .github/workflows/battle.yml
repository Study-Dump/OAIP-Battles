name: Battle

on:
  push:
    branches: ['attack-*']

permissions:
  contents: read

concurrency:
  group: battles
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main history
        run: git fetch origin main --no-tags

      - name: Parse attack-x
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [[ ! "$branch" =~ ^attack-([1-5])$ ]]; then
            echo "::error::Branch must be named attack-1 ... attack-5 (got: $branch)"
            exit 1
          fi
          target="${BASH_REMATCH[1]}"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "Target: team$target"

          if [[ ! -f solution.cpp ]]; then
            echo "::error::solution.cpp not found in branch root"
            exit 1
          fi
          if [[ ! -f README.md ]]; then
            echo "::warning::README.md not found; branch README should contain the task statement"
          fi

      - name: Compile solution
        run: |
          set -euo pipefail
          g++ -O2 -std=c++17 -o "$RUNNER_TEMP/solution" solution.cpp

      - name: Count revisions
        run: |
          python3 scripts/revisions.py \
            --target "$TARGET" \
            --out "$RUNNER_TEMP/revisions.json"

      - name: Run attacks
        run: |
          python3 scripts/run_attack.py \
            --solution "$RUNNER_TEMP/solution" \
            --attacks-dir attacks \
            --target "$TARGET" \
            --revisions "$RUNNER_TEMP/revisions.json" \
            --out "$RUNNER_TEMP/attack.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: attack-result
          path: ${{ runner.temp }}/attack.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RESULTS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: attack-result
          path: ${{ runner.temp }}/attack-result

      - name: Append result to history and scoreboard
        run: |
          set -euo pipefail
          python3 scripts/merge_attack.py \
            --result "$RUNNER_TEMP/attack-result/attack.json" \
            --history site/history.json \
            --scoreboard site/scoreboard.json

          LABEL="$(python3 -c 'import json, sys; d=json.load(open(sys.argv[1])); print("attack-" + d["target"] + " " + d["commit"][:7])' "$RUNNER_TEMP/attack-result/attack.json")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/history.json site/scoreboard.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "attack: ${LABEL} [skip ci]"
          git push origin HEAD:main
